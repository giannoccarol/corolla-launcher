[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
appcompat = "1.7.1"
recyclerview = "1.4.0"
junit = "4.13.2"
orgJson = "20250517"
qrcodegen = "1.8.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# QR codes for the phone setup page: one small pure-Java library (MIT), no Android dependency.
qrcodegen = { group = "io.nayuki", name = "qrcodegen", version.ref = "qrcodegen" }
junit4 = { group = "junit", name = "junit", version.ref = "junit" }
# The real org.json for JVM unit tests; on the device Android provides it.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
